<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:        #f4f2ec;
    --tint:      #e7ece7;
    --ink:       #333f3e;
    --ink-soft:  #6f7b77;
    --accent:    #5b8a82;
    --accent-deep:#3f6b62;
    --line:      #dcdccf;
    --sun:       #e0a458;
    --serif:     "Fraunces","Noto Serif SC",Georgia,serif;
    --sans:      "Noto Sans SC",system-ui,-apple-system,sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:400;
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 60% at 50% -10%, #eef2ec 0%, var(--bg) 55%);
    background-attachment:fixed;
  }

  .wrap{ max-width:660px; margin:0 auto; padding:0 26px; }

  header{ padding:96px 0 20px; text-align:center; }
  .sprout{ width:46px; height:auto; display:block; margin:0 auto 22px; }
  .mark{ font-family:var(--serif); font-weight:600; font-size:clamp(52px,13vw,78px); letter-spacing:.06em; line-height:1; color:var(--ink); text-decoration: none;}
  .tagline{ font-family:var(--serif); font-weight:500; font-size:clamp(17px,4.4vw,20px); color:var(--accent-deep); margin-top:18px; letter-spacing:.02em; }
  .intro{ color:var(--ink-soft); font-size:16px; margin:26px auto 0; max-width:520px; }

  /* 首页独有样式 */
  .themes{ padding:64px 0 8px; }
  .eyebrow{ font-family:var(--serif); font-weight:500; font-size:15px; color:var(--accent); letter-spacing:.14em; text-transform:uppercase; display:flex; align-items:center; gap:14px; margin-bottom:30px; }
  .eyebrow::after{ content:""; flex:1; height:1px; background:var(--line); }
  .theme{ display:flex; gap:18px; padding:20px 0; border-bottom:1px solid var(--line); }
  .theme:last-child{ border-bottom:none; }
  .dot{ flex:none; width:9px; height:9px; margin-top:12px; border-radius:50%; border:1.5px solid var(--accent); }
  .theme h3{ font-family:var(--serif); font-weight:500; font-size:19px; color:var(--ink); margin-bottom:3px; }
  .theme p{ color:var(--ink-soft); font-size:15px; line-height:1.7; }
  
  .recent{ padding:60px 0 0; }
  .note{ display:block; text-decoration:none; color:inherit; padding:22px; margin-bottom:14px; background:var(--tint); border-radius:16px; transition:transform .25s ease, box-shadow .25s ease; }
  .note:hover, .note:focus-visible{ transform:translateY(-3px); box-shadow:0 10px 26px -14px rgba(63,107,98,.45); outline:none; }
  .note .date{ font-family:var(--serif); font-size:13px; color:var(--accent); letter-spacing:.05em; }
  .note h3{ font-family:var(--serif); font-weight:500; font-size:18px; margin:4px 0 6px; color:var(--ink); }
  .note p{ color:var(--ink-soft); font-size:15px; line-height:1.7; }

  footer{ text-align:center; padding:70px 0 60px; color:var(--ink-soft); font-size:14px; }
  footer .line{ width:34px; height:1px; background:var(--line); margin:0 auto 26px; }
  footer .copy{ font-family:var(--serif); letter-spacing:.08em; margin-top:8px; color:var(--accent); }

  /* Markdown 文章详情页补充样式 */
  .post-article { padding: 40px 0; }
  .post-header { margin-bottom: 40px; text-align: center; }
  .post-header h1 { font-family: var(--serif); font-weight: 600; font-size: 28px; color: var(--ink); margin-bottom: 12px; }
  .post-header .date { font-family: var(--serif); font-size: 14px; color: var(--accent); letter-spacing: .05em; }
  .post-content h2, .post-content h3 { font-family: var(--serif); color: var(--ink); margin: 2em 0 1em; font-weight: 500; }
  .post-content p { margin-bottom: 1.5em; }
  .post-content img { max-width: 100%; height: auto; border-radius: 12px; margin: 1em 0; }
  .post-content a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); }
  
  @media (prefers-reduced-motion: no-preference){
    [data-in]{ opacity:0; transform:translateY(14px); animation:rise .8s cubic-bezier(.2,.7,.3,1) forwards; }
    [data-in="2"]{ animation-delay:.12s; }
    [data-in="3"]{ animation-delay:.24s; }
    [data-in="4"]{ animation-delay:.36s; }
    .sprout path{ stroke-dasharray:120; stroke-dashoffset:120; animation:draw 1.6s ease forwards .1s; }
  }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="{{ '/' | relative_url }}">
      <svg class="sprout" viewBox="0 0 48 60" fill="none" data-in="1">
        <path d="M24 58 C24 44 23.4 32 24 21" stroke="#5b8a82" stroke-width="2" stroke-linecap="round"/>
        <path d="M24 35 C12 37 6 31 6.5 20.5 C17 21 23.4 27 24 35 Z" stroke="#5b8a82" stroke-width="1.8" stroke-linejoin="round" fill="#5b8a82" fill-opacity=".12"/>
        <path d="M24 29 C36 31 42.5 24.5 42 14 C31.5 14.5 25 21 24 29 Z" stroke="#5b8a82" stroke-width="1.8" stroke-linejoin="round" fill="#5b8a82" fill-opacity=".12"/>
      </svg>
    </a>
    <a href="{{ '/' | relative_url }}" class="mark" data-in="1">ENHO</a>
    <div class="tagline" data-in="2">好好生活，慢慢生长</div>
    <p class="intro" data-in="3">一个属于enho的小角落。碎碎念，记记读过的书、学到的东西、走过的路...把每天认真过好。</p>
  </header>

  <!-- 这里的内容会根据当前是首页还是文章页自动替换 -->
  {{ content }}

  <footer>
    <div class="line"></div>
    谢谢你来。
    <div class="copy">© 2026 ENHO</div>
  </footer>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root{
    --paper: #F0EEE3;
    --paper-deep: #E3E0D2;
    --ink: #292722;
    --ink-soft: #726E62;
    --pine: #3F5D54;
    --plum: #7A5568;
    --measure: 640px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--pine); text-decoration:none;}
  a:hover{text-decoration:underline;}
  a:focus-visible{outline:2px solid var(--plum); outline-offset:3px;}

  header.site{
    padding:64px 24px 32px;
    max-width:var(--measure);
    margin:0 auto;
    border-bottom:1px solid var(--paper-deep);
  }
  header.site .name{
    font-family:Georgia,"Songti SC","STSong","Noto Serif SC",serif;
    font-size:28px;
    font-weight:600;
    margin:0;
  }
  header.site .name a{color:var(--ink);}
  header.site .name a:hover{text-decoration:none; color:var(--pine);}
  header.site .tagline{margin:10px 0 0; color:var(--ink-soft); font-size:15px;}

  main{max-width:var(--measure); margin:0 auto; padding:40px 24px 80px;}

  footer.site{
    max-width:var(--measure); margin:0 auto;
    padding:32px 24px 64px;
    color:var(--ink-soft); font-size:13px;
  }

  /* 首页文章列表：左侧一条竖线像笔记本的书脊，也呼应"成长"的时间线 */
  .post-list{position:relative; padding-left:20px; border-left:1px solid var(--paper-deep);}
  .entry{position:relative; padding-bottom:44px;}
  .entry:last-child{padding-bottom:0;}
  .entry-dot{position:absolute; left:-25px; top:6px; width:9px; height:9px; border-radius:50%; background:var(--pine);}
  .entry-date{display:block; font-size:13px; color:var(--ink-soft); letter-spacing:0.03em; margin-bottom:6px;}
  .entry-title{margin:0 0 8px; font-family:Georgia,"Songti SC","STSong","Noto Serif SC",serif; font-size:22px; font-weight:600; line-height:1.4;}
  .entry-title a{color:var(--ink);}
  .entry-title a:hover{color:var(--pine);}
  .entry-excerpt{margin:0; color:var(--ink-soft); font-size:15px;}
  .empty{color:var(--ink-soft);}

  /* 文章详情页 */
  .post-header{margin-bottom:32px;}
  .post-header .back{font-size:13px; color:var(--ink-soft);}
  .post-title{
    font-family:Georgia,"Songti SC","STSong","Noto Serif SC",serif;
    font-size:32px; line-height:1.35; margin:14px 0 10px;
  }
  .post-meta{font-size:13px; color:var(--ink-soft);}
  .post-content{font-size:16.5px;}
  .post-content p{margin:0 0 22px;}
  .post-content img{max-width:100%; border-radius:4px;}
  .post-content h2,.post-content h3{
    font-family:Georgia,"Songti SC","STSong","Noto Serif SC",serif;
    margin:40px 0 14px;
  }
  .post-content blockquote{
    margin:24px 0; padding:4px 20px;
    border-left:3px solid var(--plum);
    color:var(--ink-soft);
  }
  .post-content a{text-decoration:underline;}

  @media (max-width:480px){
    header.site{padding:40px 20px 24px;}
    .post-title{font-size:26px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
  <header class="site">
    <p class="name"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
    <p class="tagline">{{ site.description }}</p>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site">
    <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f2ec; --tint:#e7ece7; --ink:#333f3e; --ink-soft:#6f7b77;
    --accent:#5b8a82; --accent-deep:#3f6b62; --line:#dcdccf;
    --serif:"Fraunces","Noto Serif SC",Georgia,serif;
    --sans:"Noto Sans SC",system-ui,-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    line-height:1.85; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 60% at 50% -10%, #eef2ec 0%, var(--bg) 55%);
    background-attachment:fixed;
  }
  .wrap{ max-width:660px; margin:0 auto; padding:0 26px; }

  /* 站头（每页都有），点 ENHO 回首页 */
  .masthead{ padding:80px 0 8px; text-align:center; }
  .brand{ display:inline-block; text-decoration:none; color:inherit; }
  .sprout{ width:44px; height:auto; display:block; margin:0 auto 18px; }
  .mark{
    font-family:var(--serif); font-weight:600;
    font-size:clamp(46px,12vw,68px); letter-spacing:.06em;
    line-height:1; color:var(--ink); display:block; transition:color .3s ease;
  }
  .brand:hover .mark{ color:var(--accent-deep); }
  .tagline{
    font-family:var(--serif); font-weight:500;
    font-size:clamp(16px,4.2vw,19px); color:var(--accent-deep);
    margin-top:16px; letter-spacing:.02em;
  }

  /* 首页开场白 */
  .intro{ color:var(--ink-soft); font-size:16px; max-width:520px;
    margin:26px auto 0; text-align:center; }

  /* 小标题 */
  .eyebrow{
    font-family:var(--serif); font-weight:500; font-size:15px;
    color:var(--accent); letter-spacing:.14em; text-transform:uppercase;
    display:flex; align-items:center; gap:14px; margin-bottom:28px;
  }
  .eyebrow::after{ content:""; flex:1; height:1px; background:var(--line); }

  /* 主题 */
  .themes{ padding:60px 0 8px; }
  .theme{ display:flex; gap:18px; padding:20px 0; border-bottom:1px solid var(--line); }
  .theme:last-child{ border-bottom:none; }
  .dot{ flex:none; width:9px; height:9px; margin-top:12px; border-radius:50%; border:1.5px solid var(--accent); }
  .theme h3{ font-family:var(--serif); font-weight:500; font-size:19px; color:var(--ink); margin-bottom:3px; }
  .theme p{ color:var(--ink-soft); font-size:15px; line-height:1.7; }

  /* 最近写的 */
  .recent{ padding:56px 0 0; }
  .note{
    display:block; text-decoration:none; color:inherit; padding:22px;
    margin-bottom:14px; background:var(--tint); border-radius:16px;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .note:hover,.note:focus-visible{
    transform:translateY(-3px); box-shadow:0 10px 26px -14px rgba(63,107,98,.45); outline:none;
  }
  .note .date{ font-family:var(--serif); font-size:13px; color:var(--accent); letter-spacing:.05em; }
  .note h3{ font-family:var(--serif); font-weight:500; font-size:18px; margin:4px 0 6px; color:var(--ink); }
  .note p{ color:var(--ink-soft); font-size:15px; line-height:1.7; }
  .empty{ color:var(--ink-soft); text-align:center; padding:14px 0; }

  /* 文章页 */
  .post{ padding:36px 0 0; }
  .back{ font-family:var(--serif); color:var(--accent); text-decoration:none; font-size:15px; display:inline-block; margin-bottom:26px; }
  .back:hover{ color:var(--accent-deep); }
  .post-title{ font-family:var(--serif); font-weight:600; font-size:clamp(26px,6vw,34px); line-height:1.3; color:var(--ink); }
  .post-date{ font-family:var(--serif); color:var(--accent); font-size:14px; margin:10px 0 30px; }
  .post-content{ color:var(--ink); line-height:1.9; }
  .post-content p{ margin:1.1em 0; }
  .post-content h2{ font-family:var(--serif); font-weight:600; font-size:23px; margin:1.6em 0 .5em; }
  .post-content h3{ font-family:var(--serif); font-weight:500; font-size:19px; margin:1.4em 0 .4em; }
  .post-content a{ color:var(--accent-deep); }
  .post-content img{ max-width:100%; height:auto; border-radius:14px; margin:1.5em 0; display:block; }
  .post-content blockquote{ border-left:3px solid var(--accent); padding-left:18px; color:var(--ink-soft); font-style:italic; margin:1.3em 0; }
  .post-content ul,.post-content ol{ padding-left:1.4em; margin:1.1em 0; }
  .post-content li{ margin:.4em 0; }
  .post-content code{ background:var(--tint); padding:2px 6px; border-radius:6px; font-size:.9em; }

  /* 页脚 */
  footer{ text-align:center; padding:70px 0 60px; color:var(--ink-soft); font-size:14px; }
  footer .line{ width:34px; height:1px; background:var(--line); margin:0 auto 26px; }
  footer .copy{ font-family:var(--serif); letter-spacing:.08em; margin-top:8px; color:var(--accent); }

  /* 轻微动效（尊重“减少动态”偏好） */
  @media (prefers-reduced-motion: no-preference){
    body{ animation:fadein .8s ease both; }
    .sprout path{ stroke-dasharray:120; stroke-dashoffset:120; animation:draw 1.6s ease forwards .15s; }
  }
  @keyframes fadein{ from{opacity:0} to{opacity:1} }
  @keyframes draw{ to{ stroke-dashoffset:0 } }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg class="sprout" viewBox="0 0 48 60" fill="none">
        <path d="M24 58 C24 44 23.4 32 24 21" stroke="#5b8a82" stroke-width="2" stroke-linecap="round"/>
        <path d="M24 35 C12 37 6 31 6.5 20.5 C17 21 23.4 27 24 35 Z" stroke="#5b8a82" stroke-width="1.8" stroke-linejoin="round" fill="#5b8a82" fill-opacity=".12"/>
        <path d="M24 29 C36 31 42.5 24.5 42 14 C31.5 14.5 25 21 24 29 Z" stroke="#5b8a82" stroke-width="1.8" stroke-linejoin="round" fill="#5b8a82" fill-opacity=".12"/>
      </svg>
      <span class="mark">ENHO</span>
    </a>
    <div class="tagline">好好生活，慢慢生长</div>
  </header>

  {{ content }}

  <footer>
    <div class="line"></div>
    谢谢你来。慢慢看，不着急。
    <div class="copy">© 2026 ENHO</div>
  </footer>

</div>
</body>
</html>
